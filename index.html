<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedTeam Sim — Sanal Pentest Masaüstü</title>
<style>
:root{
  --bg:#0b0f10; --panel:#141c1e; --panel2:#0e1517; --text:#d7f7e3; --dim:#7fa397;
  --accent:#39ff88; --danger:#ff4d5e; --warn:#ffcc33; --border:#243432; --info:#7fd6ff;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#0b0f10; --panel:#141c1e; --panel2:#0e1517; --text:#d7f7e3; --dim:#7fa397;
    --accent:#39ff88; --danger:#ff4d5e; --warn:#ffcc33; --border:#243432; --info:#7fd6ff;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:radial-gradient(circle at 20% 10%,#122018,var(--bg) 60%);
  color:var(--text); font-family:'Courier New',monospace; overflow:hidden;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#desktop{position:fixed;inset:0;top:env(safe-area-inset-top,0px);bottom:calc(46px + env(safe-area-inset-bottom,0px));overflow:hidden;}
.topbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:26px;background:#0a0f0f;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:.68rem;color:var(--dim);z-index:999;}
.icons{position:absolute;top:36px;left:10px;display:flex;flex-direction:column;gap:16px;}
.icon{width:72px;text-align:center;cursor:pointer;color:var(--text);font-size:.68rem;user-select:none;}
.icon .glyph{font-size:1.8rem;display:block;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 0;margin-bottom:3px;}
.icon:active .glyph{border-color:var(--accent);}
.hud{position:absolute;top:36px;right:8px;width:150px;display:flex;flex-direction:column;gap:6px;z-index:5;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:.68rem;}
.card label{display:block;color:var(--dim);font-size:.6rem;text-transform:uppercase;}
.card .val{font-weight:bold;}
.barbg{background:#1a2423;border-radius:6px;height:6px;overflow:hidden;margin-top:3px;}
.barfill{height:100%;background:var(--accent);width:0%;transition:width .3s;}
.window{position:absolute;background:var(--panel2);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;min-width:260px;}
.winbar{background:#162321;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;cursor:grab;border-bottom:1px solid var(--border);touch-action:none;}
.winbar .t{font-size:.72rem;color:var(--accent);font-weight:bold;}
.winbar .x{background:var(--danger);color:#1a0a0a;border:none;width:20px;height:20px;border-radius:50%;font-weight:bold;font-size:.7rem;line-height:1;cursor:pointer;}
.wincontent{flex:1;overflow:auto;padding:8px;font-size:.8rem;}
#taskbar{position:fixed;left:0;right:0;bottom:0;height:46px;padding-bottom:env(safe-area-inset-bottom,0px);background:#0a0f0f;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto;z-index:1000;}
.taskchip{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:.68rem;white-space:nowrap;cursor:pointer;}
.taskchip.active{border-color:var(--accent);color:var(--accent);}
/* terminal */
#term{background:#070a0a;border:1px solid var(--border);border-radius:6px;height:260px;overflow-y:auto;padding:8px;font-size:.78rem;white-space:pre-wrap;word-break:break-word;}
.line{margin-bottom:2px;}
.prompt{color:var(--accent);} .err{color:var(--danger);} .warn{color:var(--warn);} .info{color:var(--info);} .ok{color:var(--accent);}
.defender{color:var(--danger);font-weight:bold;}
.termrow{display:flex;gap:6px;margin-top:6px;}
.termrow input{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-family:inherit;font-size:.8rem;}
.termrow button{background:var(--accent);color:#06130c;border:none;border-radius:6px;padding:0 12px;font-weight:bold;}
/* browser */
.addr{display:flex;gap:6px;margin-bottom:6px;}
.addr input{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px;border-radius:6px;font-family:inherit;font-size:.75rem;}
.addr button{background:var(--info);color:#06130c;border:none;border-radius:6px;padding:0 10px;font-weight:bold;font-size:.75rem;}
.page{background:#0d1512;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:.78rem;min-height:180px;}
.page h3{margin:0 0 6px;color:var(--accent);font-size:.9rem;}
/* chat */
.msg{margin-bottom:8px;max-width:85%;padding:6px 9px;border-radius:8px;font-size:.78rem;}
.msg.them{background:var(--panel);border:1px solid var(--border);}
.msg.me{background:#0e2a1c;border:1px solid var(--accent);margin-left:auto;}
.msg b{display:block;font-size:.62rem;color:var(--dim);margin-bottom:2px;}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.quick button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:.68rem;}
/* rdp */
.rdpdesktop{background:#0a2238;border-radius:6px;min-height:200px;padding:10px;position:relative;}
.rdpicon{display:inline-block;text-align:center;width:70px;cursor:pointer;font-size:.68rem;color:#eaf6ff;vertical-align:top;}
.rdpicon .g{font-size:1.7rem;display:block;}
.notepad{background:#fdfdf5;color:#111;border-radius:6px;padding:12px;font-size:.8rem;min-height:120px;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:2000;}
#overlay.show{display:flex;}
#overlay .box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px;max-width:420px;}
#overlay button{margin-top:14px;background:var(--accent);color:#06130c;border:none;border-radius:6px;padding:10px 18px;font-weight:bold;}
</style>
</head>
<body>
<div class="topbar"><span>⚡ RedTeam Sim — sanal işletim ortamı (tamamen simüle)</span><span id="clock"></span></div>
<div id="desktop">
  <div class="icons">
    <div class="icon" onclick="openApp('terminal')"><span class="glyph">🖥️</span>Terminal</div>
    <div class="icon" onclick="openApp('browser')"><span class="glyph">🌐</span>Tarayıcı</div>
    <div class="icon" onclick="openApp('chat')"><span class="glyph">💬</span>Chat</div>
    <div class="icon" id="rdpIcon" style="display:none" onclick="openApp('rdp')"><span class="glyph">🪟</span>WIN-SRV</div>
  </div>
  <div class="hud">
    <div class="card"><label>Şüphe</label><div class="val" id="susVal">0%</div><div class="barbg"><div class="barfill" id="susBar"></div></div></div>
    <div class="card"><label>Kaynak IP</label><div class="val" id="myIpVal">—</div></div>
    <div class="card"><label>Proxy hakkı</label><div class="val" id="proxyVal">4</div></div>
    <div class="card"><label>Erişim</label><div class="val" id="accessVal">Yok</div></div>
  </div>
</div>
<div id="taskbar"></div>
<div id="overlay"><div class="box"><h2 id="ovTitle"></h2><p id="ovMsg"></p><button onclick="hideOverlay()">Kapat</button></div></div>

<script>
/* ========== GENEL DURUM ========== */
const TARGET_IP = '10.10.10.5';
let state, timer, winIp;
let z = 10;
const openWins = {}; // id -> {el, app}

function freshState(){
  return {
    ip: randIp(), suspicion: 0, proxiesLeft: 4, banned: false, gameOver: false,
    access: 'none', // none -> foothold -> root
    knowPorts:false, openPorts:[], gotCreds:false, inDesktop:false, found:false,
    osintDone:false, honeypotWarned:false, honeypotTriggered:false,
    sawSuidList:false, rootAchieved:false, winCredsKnown:false, rdpConnected:false,
    cmdLog:[]
  };
}
function randIp(){ return `${10+Math.floor(Math.random()*180)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`; }
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function updateHud(){
  const s=Math.min(100,Math.max(0,state.suspicion));
  document.getElementById('susVal').textContent=Math.round(s)+'%';
  const bar=document.getElementById('susBar');
  bar.style.width=s+'%'; bar.style.background = s<40?'var(--accent)':s<75?'var(--warn)':'var(--danger)';
  const ipv=document.getElementById('myIpVal'); ipv.textContent=state.banned?state.ip+' (BANLI)':state.ip; ipv.style.color=state.banned?'var(--danger)':'var(--text)';
  document.getElementById('proxyVal').textContent=state.proxiesLeft;
  document.getElementById('accessVal').textContent = state.access==='root'?'root@dmz':state.access==='foothold'?'düşük yetki':(state.gotCreds?'Kimlik var':'Yok');
}
function addSuspicion(n,note,where){
  state.suspicion+=n;
  if(note) termPrint(`<span class="warn">[risk] ${note} (+${n} şüphe)</span>`);
  updateHud(); checkDefenderRoll(true);
}
function checkDefenderRoll(immediate){
  if(state.gameOver||state.banned) return;
  const chance = state.suspicion/100*(immediate?0.28:0.09);
  if(Math.random()<chance) banCurrentIp();
}
function banCurrentIp(){
  state.banned=true; state.access='none'; state.inDesktop=false;
  termPrint(`<span class="defender">[DEFENDER] Şüpheli trafik tespit edildi! Kaynak IP ${state.ip} banlandı, bağlantı koptu.</span>`);
  termPrint(`<span class="info">"change-ip" ile yeni bir çıkışa geç (bulduğun bilgiler korunur).</span>`);
  updateHud();
  chatMsg('them','SOC Ekibi','Ağımızda şüpheli bir IP tespit ettik ve engelledik. Dikkatli ol.');
  if(state.proxiesLeft<=0){
    state.gameOver=true; clearInterval(timer);
    showOverlay('🚨 Operasyon Çöktü','Tüm proxy çıkışların banlandı, elinde yeni kimlik kalmadı. Terminalde "oyna" yazarak tekrar deneyebilirsin.');
  }
}
function rateLimitCheck(base){
  const now=Date.now();
  state.cmdLog.push({c:base,t:now});
  state.cmdLog = state.cmdLog.filter(e=>now-e.t<20000);
  const count = state.cmdLog.filter(e=>e.c===base).length;
  if(count>=3){
    addSuspicion(10,'IDS: aynı komut deseni tekrar tekrar tespit edildi (rate-limit alarmı)');
  }
}

/* ========== PENCERE YÖNETİCİSİ ========== */
function openApp(app){
  if(openWins[app]){ focusWin(app); return; }
  const builders = {terminal:buildTerminal, browser:buildBrowser, chat:buildChat, rdp:buildRdp};
  const titles = {terminal:'🖥️ Terminal', browser:'🌐 Tarayıcı', chat:'💬 Chat — İşveren', rdp:'🪟 WIN-SRV (RDP)'};
  const sizes = {terminal:[340,420], browser:[320,360], chat:[300,380], rdp:[320,360]};
  if(app==='rdp' && !state.rdpConnected){ return; }
  const [w,h] = sizes[app];
  const el = document.createElement('div');
  el.className='window'; el.style.width=Math.min(w,window.innerWidth-20)+'px'; el.style.height=h+'px';
  const n = Object.keys(openWins).length;
  el.style.left = Math.min(20+n*22, window.innerWidth-w-10)+'px';
  el.style.top = (10+n*20)+'px';
  el.innerHTML = `<div class="winbar" data-app="${app}"><span class="t">${titles[app]}</span><button class="x" onclick="closeWin('${app}')">✕</button></div><div class="wincontent" id="wc-${app}"></div>`;
  document.getElementById('desktop').appendChild(el);
  openWins[app]={el};
  makeDraggable(el.querySelector('.winbar'), el);
  focusWin(app);
  builders[app](document.getElementById('wc-'+app));
  renderTaskbar();
}
function closeWin(app){ if(openWins[app]){ openWins[app].el.remove(); delete openWins[app]; renderTaskbar(); } }
function focusWin(app){ if(openWins[app]){ openWins[app].el.style.zIndex=++z; renderTaskbar(app); } }
function renderTaskbar(active){
  const tb=document.getElementById('taskbar'); tb.innerHTML='';
  Object.keys(openWins).forEach(app=>{
    const chip=document.createElement('div');
    chip.className='taskchip'+(app===active?' active':'');
    chip.textContent=app;
    chip.onclick=()=>focusWin(app);
    tb.appendChild(chip);
  });
}
function makeDraggable(bar, el){
  let sx,sy,ox,oy,dragging=false;
  bar.addEventListener('pointerdown', e=>{
    dragging=true; sx=e.clientX; sy=e.clientY;
    ox=parseInt(el.style.left); oy=parseInt(el.style.top);
    focusWin(bar.dataset.app);
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e=>{
    if(!dragging) return;
    let nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    nx=Math.max(0,Math.min(window.innerWidth-60,nx));
    ny=Math.max(0,Math.min(window.innerHeight-80,ny));
    el.style.left=nx+'px'; el.style.top=ny+'px';
  });
  bar.addEventListener('pointerup', ()=>dragging=false);
}

/* ========== TERMINAL ========== */
function termPrint(html,cls){
  const t=document.getElementById('term'); if(!t) return;
  const d=document.createElement('div'); d.className='line'+(cls?' '+cls:'');
  d.innerHTML=html; t.appendChild(d); t.scrollTop=t.scrollHeight;
}
function buildTerminal(c){
  c.innerHTML = `<div id="term"></div><div class="termrow"><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="komut yaz..."><button id="send">Gönder</button></div>`;
  termPrint('RedTeam Sim v3.0 — eğitim amaçlı sanal pentest ortamı','info');
  termPrint(`Hedef: <b>${TARGET_IP}</b>. "help" yaz. Önce Tarayıcı'dan OSINT yapman önerilir.`,'info');
  document.getElementById('send').onclick=()=>{const i=document.getElementById('cmd');runCmd(i.value);i.value='';};
  document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter'){runCmd(e.target.value);e.target.value='';}});
}
const HELP = `OSINT:
  (Tarayıcı'yı aç, targetcorp.local adresine git)
  theharvester targetcorp.local   çalışan e-posta/kullanıcı adı formatını bulur

Keşif:
  nmap -sS ${TARGET_IP}      sessiz tarama, düşük risk
  nmap -A ${TARGET_IP}       detaylı tarama, versiyonlar + ipuçları (honeypot dahil!)
  nikto ${TARGET_IP}         web zafiyet taraması

Erişim (port açıksa):
  ftp ${TARGET_IP}           anonim giriş dene
  get backup.zip             ftp içinde yedek indir → şifre sızabilir
  hydra ${TARGET_IP} ssh     brute-force, yüksek risk
  ssh admin@${TARGET_IP}     bulunan kimlikle bağlan (düşük yetkili shell)

Yetki yükseltme (foothold sonrası):
  whoami                     mevcut kullanıcıyı göster
  find / -perm -4000         SUID binary ara
  /usr/local/bin/sysbackup --root-shell   bulunan SUID açığını kullan → root

Yanal hareket (root sonrası):
  cat /root/.creds           ikinci makinenin (Windows) IP/şifresini bulur
  rdp <win_ip>                RDP ile ikinci makineye geç (WIN-SRV ikonu açılır)

Dikkat:
  connect 8080 / exploit 8080   şüpheli derecede temiz port — TUZAK OLABİLİR

Kimlik yönetimi:
  myip / change-ip            banlandıysan yeni kaynak IP al (sınırlı hak)

  clear-logs (shell'de)       iz temizle, şüpheyi düşürür
  clear / help / oyna         ekranı temizle / yardım / oyunu baştan başlat`;

function blockedIfBanned(){ if(state.banned){ termPrint('<span class="err">Bağlantı reddedildi — IP banlı. "change-ip" çalıştır.</span>'); return true;} return false; }

function runCmd(raw){
  const cmd=raw.trim(); if(!cmd) return;
  termPrint(`<span class="prompt">pentester@kali:~$</span> ${escapeHtml(cmd)}`);
  const low=cmd.toLowerCase();
  if(low==='oyna'){ fullReset(); return; }
  if(state.gameOver){ termPrint('<span class="err">Operasyon sona erdi. "oyna" yazarak yeniden başlat.</span>'); return; }
  if(low==='help'){ termPrint(HELP.replace(/\n/g,'<br>')); return; }
  if(low==='clear'){ document.getElementById('term').innerHTML=''; return; }
  if(low==='myip'){ termPrint(`Kaynak IP: ${state.ip}${state.banned?' (BANLI)':''}`); return; }
  if(low==='change-ip'){
    if(state.proxiesLeft<=0){ termPrint('<span class="err">Kullanılabilir proxy kalmadı.</span>'); return; }
    state.proxiesLeft--; state.ip=randIp(); state.banned=false; state.suspicion=Math.max(0,state.suspicion-15);
    termPrint(`<span class="ok">Yeni kaynak IP: ${state.ip} (kalan hak: ${state.proxiesLeft})</span>`); updateHud(); return;
  }
  if(blockedIfBanned()) return;

  const base = low.split(' ')[0];
  if(['nmap','hydra','nikto','ftp','exploit','connect','find'].includes(base)) rateLimitCheck(base);

  if(low.startsWith('theharvester')){
    addSuspicion(2,'Pasif OSINT sorgusu (düşük risk)');
    state.osintDone=true;
    termPrint('[theharvester] targetcorp.local → 4 e-posta bulundu:<br>ayse.yilmaz@targetcorp.local, mehmet.koc@targetcorp.local, admin@targetcorp.local<br>Format: isim.soyisim — kullanıcı adı tahmini için işe yarayabilir.');
    return;
  }
  if(low.startsWith('nmap')){
    if(!low.includes(TARGET_IP)){ termPrint('<span class="err">Hedef belirt: nmap -sS '+TARGET_IP+'</span>'); return; }
    state.knowPorts=true; state.openPorts=['21/ftp','22/ssh','80/http','445/smb','8080/http'];
    if(low.includes('-a')){
      addSuspicion(20,'Agresif tam tarama çok fazla paket gönderdi');
      state.honeypotWarned=true;
      termPrint('PORT    STATE  SERVICE  VERSION<br>21/tcp  open   ftp      vsftpd 2.3 (anonim girişe açık olabilir)<br>22/tcp  open   ssh      OpenSSH 7.2<br>80/tcp  open   http     Apache 2.4<br>445/tcp open   smb      Samba 4.3 (bilinen bir açık var)<br>8080/tcp open   http     Jetty 9.2 <span class="warn">— alışılmadık derecede temiz/davetkâr, kontrollü yaklaş</span>');
    } else if(low.includes('-ss')){
      addSuspicion(6,'Stealth SYN taraması iz bıraktı');
      termPrint('PORT    STATE  SERVICE<br>21/tcp  open   ftp<br>22/tcp  open   ssh<br>80/tcp  open   http<br>445/tcp open   smb<br>8080/tcp open   http');
    } else {
      addSuspicion(10,'Standart tarama algılandı');
      termPrint('PORT    STATE  SERVICE<br>21/tcp  open   ftp<br>22/tcp  open   ssh<br>80/tcp  open   http<br>445/tcp open   smb<br>8080/tcp open   http');
    }
    return;
  }
  if(low.startsWith('nikto')){
    if(!state.knowPorts){ termPrint('<span class="err">Önce nmap çalıştır.</span>'); return; }
    addSuspicion(9,'Web zafiyet taraması loglara düştü');
    state.honeypotWarned=true;
    termPrint('[nikto] /admin paneli tespit edildi. 8080 portundaki servis şüpheli derecede standart — olası honeypot işareti.');
    return;
  }
  if(low.startsWith('connect 8080')||low.startsWith('exploit 8080')||low.includes('8080')){
    state.honeypotTriggered=true;
    addSuspicion(state.honeypotWarned?25:50,'TUZAK! 8080 portu bir honeypot çıktı, aktivite anında loglandı');
    termPrint('<span class="defender">[TUZAK] Bu servis bir honeypot. Her hareketin merkezi SOC sistemine gerçek zamanlı iletildi!</span>');
    return;
  }
  if(low.startsWith('ftp')){
    if(!state.knowPorts){ termPrint('<span class="err">Önce nmap ile 21. portu keşfet.</span>'); return; }
    addSuspicion(4,'FTP bağlantısı loglandı');
    termPrint('<span class="ok">[ftp] Anonim giriş başarılı.</span><br>backup.zip&nbsp;&nbsp;readme.txt<br>İpucu: "get backup.zip"');
    state._ftpOpen=true; return;
  }
  if(low.startsWith('get backup.zip')){
    if(!state._ftpOpen){ termPrint('<span class="err">Önce ftp ile bağlan.</span>'); return; }
    addSuspicion(3,'Dosya indirme loglandı'); state.gotCreds=true;
    termPrint('<span class="ok">[get] backup.zip → creds.txt: admin : B4ckup_2019!</span>'); return;
  }
  if(low.startsWith('hydra')){
    if(!state.knowPorts){ termPrint('<span class="err">Önce nmap çalıştır.</span>'); return; }
    addSuspicion(28,'Brute-force çok sayıda başarısız giriş üretti');
    if(Math.random()<0.75){ state.gotCreds=true; termPrint('<span class="ok">[hydra] Geçerli giriş: admin : P@ssw0rd123</span>'); }
    else termPrint('<span class="err">[hydra] Kombinasyon bulunamadı. Tekrar deneyebilirsin (risk birikir).</span>');
    return;
  }
  if(low.startsWith('ssh')){
    if(!state.gotCreds){ termPrint('<span class="err">Önce kimlik bilgisi bul (hydra / ftp+backup.zip).</span>'); return; }
    addSuspicion(7,'Oturum açma loglandı'); state.access='foothold';
    termPrint('<span class="ok">Bağlantı başarılı. ftpuser@dmz01:~$ (düşük yetkili shell)</span>'); updateHud(); return;
  }
  if(low==='whoami'){
    if(state.access==='none'){ termPrint('<span class="err">Shell yok.</span>'); return; }
    termPrint(state.access==='root'?'root':'ftpuser'); return;
  }
  if(low.startsWith('find / -perm')){
    if(state.access==='none'){ termPrint('<span class="err">Önce shell erişimi lazım.</span>'); return; }
    addSuspicion(3,'Dosya sistemi taraması loglandı'); state.sawSuidList=true;
    termPrint('/usr/bin/passwd<br>/usr/bin/sudo<br><span class="warn">/usr/local/bin/sysbackup  ← standart değil, GTFOBins tarzı kötüye kullanılabilir</span>');
    return;
  }
  if(low.includes('sysbackup')){
    if(!state.sawSuidList){ termPrint('<span class="err">Önce "find / -perm -4000" ile keşfet.</span>'); return; }
    addSuspicion(8,'SUID istismarı loglandı'); state.access='root'; state.rootAchieved=true;
    termPrint('<span class="ok">[sysbackup] Root shell elde edildi! root@dmz01:~#</span>'); updateHud();
    chatMsg('them','SOC Ekibi','Dahili bir sistemde anormal yetki yükseltme davranışı gözlemledik, inceliyoruz.');
    return;
  }
  if(low.startsWith('cat /root/.creds')){
    if(state.access!=='root'){ termPrint('<span class="err">Yetkin yok (root gerekli).</span>'); return; }
    winIp = winIp || randIp();
    state.winCredsKnown=true;
    termPrint(`[.creds] WIN-SRV → ${winIp} | administrator : W1nt3r_2024!`); return;
  }
  if(low.startsWith('rdp')){
    if(!state.winCredsKnown){ termPrint('<span class="err">Önce /root/.creds dosyasını bul.</span>'); return; }
    if(!low.includes(winIp)){ termPrint('<span class="err">IP veya kimlik hatalı.</span>'); return; }
    addSuspicion(10,'Yanal hareket (lateral movement) ağ içinde dikkat çekti');
    state.rdpConnected=true;
    document.getElementById('rdpIcon').style.display='';
    termPrint('<span class="ok">[rdp] WIN-SRV makinesine bağlanıldı. Masaüstündeki WIN-SRV ikonunu aç.</span>');
    chatMsg('them','Proje Yöneticisi (Ayşe)','İç ağda ikinci bir makineye geçtiğini görüyorum, harika gidiyorsun — dikkatli ol.');
    return;
  }
  if(low==='clear-logs'){
    if(state.access==='none'){ termPrint('<span class="err">Shell gerekli.</span>'); return; }
    state.suspicion=Math.max(0,state.suspicion-20); addSuspicion(5,'Log temizleme küçük bir iz bıraktı');
    termPrint('<span class="ok">[clear-logs] Loglar temizlendi, şüphe düştü.</span>'); return;
  }
  termPrint('<span class="err">Komut bulunamadı. "help" yaz.</span>');
}

/* ========== BROWSER (OSINT) ========== */
const PAGES = {
  'targetcorp.local': `<h3>TargetCorp — Kurumsal Site</h3><p>Biz bir fintech şirketiyiz. Ekibimiz: Ayşe Yılmaz (PM), Mehmet Koç (SysAdmin), Admin (BT).</p><p style="color:var(--dim)">Not: kullanıcı adları genelde isim.soyisim formatındadır.</p>`,
  [TARGET_IP]: `<h3>${TARGET_IP} — Varsayılan Apache Sayfası</h3><p>Apache2 Ubuntu Default Page. /admin altında bir giriş paneli var.</p>`,
  [TARGET_IP+':8080']: `<h3>${TARGET_IP}:8080 — "Gizli" Panel</h3><p style="color:var(--warn)">Çok temiz, çok davetkâr bir yönetici paneli... Gerçek mi, yoksa tuzak mı? Terminalden dikkatli yaklaş.</p>`,
};
function buildBrowser(c){
  c.innerHTML = `<div class="addr"><input id="url" placeholder="adres gir (örn. targetcorp.local)"><button id="go">Git</button></div><div class="page" id="page">Bir adres gir ve "Git"e bas.</div>`;
  document.getElementById('go').onclick=navigate;
  document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')navigate();});
}
function navigate(){
  const u=document.getElementById('url').value.trim().toLowerCase();
  const page=document.getElementById('page');
  if(PAGES[u]){ page.innerHTML=PAGES[u]; if(u==='targetcorp.local') state.osintDone=true; }
  else page.innerHTML = `<p class="err">Bu adrese ulaşılamıyor (DNS çözümlenemedi ya da port kapalı).</p>`;
}

/* ========== CHAT ========== */
function buildChat(c){
  c.innerHTML = `<div id="chatlog"></div><div class="quick">
    <button onclick="chatReply('Durum iyi, keşif yapıyorum.')">Durum bildir</button>
    <button onclick="chatReply('İpucu lazım.')">İpucu iste</button>
  </div>`;
  chatMsg('them','Proje Yöneticisi (Ayşe)','Merhaba! Yetkili pentest kapsamı: '+TARGET_IP+'. Hedef masaüstündeki top_secret.txt dosyası. Başarılar!');
}
function chatMsg(who,name,text){
  const log=document.getElementById('chatlog'); if(!log) return;
  const d=document.createElement('div'); d.className='msg '+(who==='me'?'me':'them');
  d.innerHTML = `<b>${name}</b>${escapeHtml(text)}`; log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function chatReply(t){ chatMsg('me','Sen',t);
  setTimeout(()=>chatMsg('them','Proje Yöneticisi (Ayşe)', state.suspicion>60?'Dikkatli ol, iz bırakıyor gibisin.':'Güzel gidiyor, devam et!'),500);
}

/* ========== RDP (yanal hareket sonrası) ========== */
function buildRdp(c){
  c.innerHTML = `<div class="rdpdesktop"><div class="rdpicon" onclick="openExplorer()"><span class="g">📁</span>Masaüstü</div></div>`;
}
function openExplorer(){
  if(document.getElementById('wc-explorer')){ return; }
  openWinSimple('explorer','📁 Masaüstü',`<div class="page"><div class="rdpicon" onclick="openSecretFile()" style="color:var(--text)"><span class="g">📄</span>top_secret.txt</div><div class="rdpicon" style="color:var(--text)"><span class="g">📄</span>notes.txt</div></div>`);
}
function openSecretFile(){
  state.found=true; state.gameOver=true; clearInterval(timer);
  openWinSimple('secret','📄 top_secret.txt',`<div class="notepad">"Proje KARA KUTU: Q3 birleşme planları ve erişim anahtarları..."<br><br>— Dosya ele geçirildi —</div>`);
  chatMsg('them','Proje Yöneticisi (Ayşe)',`Harika iş çıkardın! Dosyayı aldığını gördüm. Şüphe seviyen %${Math.round(state.suspicion)} idi. Raporunu bekliyorum, teşekkürler! 🎉`);
  showOverlay('🏁 Görev Tamamlandı','top_secret.txt dosyasını başarıyla ele geçirdin. Teşekkürler, operasyon kayıtlara geçti. Tekrar oynamak için terminalde "oyna" yaz.');
  updateHud();
}
function openWinSimple(id,title,html){
  const el=document.createElement('div'); el.className='window'; el.style.width='260px'; el.style.height='220px';
  el.style.left='40px'; el.style.top='40px';
  el.innerHTML=`<div class="winbar" data-app="${id}"><span class="t">${title}</span><button class="x" onclick="closeWin('${id}')">✕</button></div><div class="wincontent" id="wc-${id}">${html}</div>`;
  document.getElementById('desktop').appendChild(el);
  openWins[id]={el}; makeDraggable(el.querySelector('.winbar'),el); focusWin(id); renderTaskbar();
}

/* ========== GENEL ========== */
function showOverlay(t,m){ document.getElementById('ovTitle').textContent=t; document.getElementById('ovMsg').textContent=m; document.getElementById('overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

function fullReset(){
  hideOverlay();
  Object.keys(openWins).forEach(a=>{openWins[a].el.remove();}); for(const k in openWins) delete openWins[k];
  document.getElementById('rdpIcon').style.display='none';
  state=freshState(); winIp=null; updateHud(); renderTaskbar();
  clearInterval(timer);
  timer=setInterval(()=>{ if(!state.gameOver && !state.banned){ state.suspicion=Math.max(0,state.suspicion-1.5); updateHud(); checkDefenderRoll(false); } },4000);
  openApp('terminal');
}
function tickClock(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(tickClock,1000); tickClock();

fullReset();
</script>
